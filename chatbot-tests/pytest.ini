[pytest]
addopts = -s -v --tb=short
testpaths = tests/test_scenario.py
asyncio_mode = auto
timeout = 5700
timeout_method = signal
markers =
    argos: Argos 'Ask Trevor' scenario test
    budget: Budget-conscious shopper persona
    tech: Tech enthusiast / spec-driven persona
    gifts: Gift shopper / parent persona
    appliances: Home & family practicality persona
    accessibility: Accessibility & senior persona
    customer_service: Fulfillment & customer service persona
    multi_turn: Multi-turn dialogue persona
    guardrails: Brand safety & adversarial persona
